<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveShot · 空气射击</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="menu-page">
    <h1 class="title">WaveShot</h1>
    <p class="subtitle">空气射击 · FIRST PERSON SHOOTER</p>

    <div class="map-categories" id="map-categories"></div>
    <div class="map-select" id="map-select"></div>
    <p class="map-hint" id="map-hint"></p>

    <div class="menu-buttons">
      <a class="btn primary" href="game.html">开始游戏</a>
      <a class="btn" href="settings.html">设置</a>
      <button class="btn" id="help-btn">游戏说明</button>
    </div>

    <div class="help" id="help-box" style="display:none;">
      <p>🖱️ 鼠标移动视角 · 鼠标左键射击</p>
      <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动　<kbd>Shift</kbd> 冲刺　<kbd>空格</kbd> 跳跃</p>
      <p><kbd>R</kbd> 换弹　<kbd>B</kbd> 购买武器　<kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> 切换武器　鼠标右键开镜（狙击枪）　<kbd>Esc</kbd> 暂停</p>
      <p>每波开始有 12 秒准备时间：站在绿色购买区内按 <kbd>B</kbd> 买东西（击杀 +$300）</p>
      <p>击杀敌人可得分，撑过更多波次！</p>
    </div>
  </div>

  <script src="js/shared.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
