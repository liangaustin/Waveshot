<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 - WaveShot</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="settings-page">
    <div class="settings-panel">
      <h2>设 置</h2>

      <div class="field">
        <label>鼠标灵敏度</label>
        <div class="row">
          <input type="range" id="sensitivity" min="0.0005" max="0.006" step="0.0001">
          <span class="val" id="sensitivity-val">-</span>
        </div>
      </div>

      <div class="field">
        <label>音量</label>
        <div class="row">
          <input type="range" id="volume" min="0" max="1" step="0.01">
          <span class="val" id="volume-val">-</span>
        </div>
      </div>

      <div class="field">
        <label>画质</label>
        <select id="quality">
          <option value="low">低</option>
          <option value="medium">中</option>
          <option value="high">高</option>
        </select>
      </div>

      <div class="field switch">
        <label>反转 Y 轴</label>
        <input type="checkbox" id="invertY">
      </div>

      <div class="field">
        <label>准星颜色</label>
        <div class="row">
          <input type="color" id="crosshairColor" style="width:100%; height:34px; border:1px solid var(--line); border-radius:8px; background:transparent; cursor:pointer;">
        </div>
      </div>

      <div class="settings-actions">
        <button class="btn secondary" id="save-btn">保存</button>
        <button class="btn" id="back-btn">返回</button>
      </div>
    </div>
  </div>

  <script src="js/shared.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
